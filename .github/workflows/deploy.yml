name: Deploy InnovaTech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t rexdeadx/innovatech-front:latest ./front_despacho
          docker build -t rexdeadx/innovatech-ventas:latest ./back-Ventas_SpringBoot
          docker build -t rexdeadx/innovatech-despachos:latest ./back-Despachos_SpringBoot

          docker push rexdeadx/innovatech-front:latest
          docker push rexdeadx/innovatech-ventas:latest
          docker push rexdeadx/innovatech-despachos:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/app
            git pull origin deploy
            sg docker -c "docker-compose down -v"
            sg docker -c "docker-compose pull"
            sg docker -c "docker-compose up -d"