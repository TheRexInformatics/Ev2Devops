name: Deploy InnovaTech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Images
        run: |
          # Construcción con rutas exactas
          docker build -t rexdeadx/innovatech-front:latest ./front_despacho
          docker build -t rexdeadx/innovatech-ventas:latest ./back-Ventas_SpringBoot
          docker build -t rexdeadx/innovatech-despachos:latest ./back-Despachos_SpringBoot

          # Subida a Docker Hub
          docker push rexdeadx/innovatech-front:latest
          docker push rexdeadx/innovatech-ventas:latest
          docker push rexdeadx/innovatech-despachos:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------
      # 1. DESPLIEGUE DEL FRONTEND (En la Subred Pública)
      # ---------------------------------------------------
      - name: Deploy Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Bajar última imagen
            sudo docker pull rexdeadx/innovatech-front:latest
            
            # Limpiar versión anterior
            sudo docker stop front-app || true
            sudo docker rm front-app || true
            
            # Correr contenedor exponiendo el puerto 80
            sudo docker run -d -p 80:80 --name front-app rexdeadx/innovatech-front:latest

      # ---------------------------------------------------
      # 2. DESPLIEGUE DEL BACK Y BD (A través del Puente)
      # ---------------------------------------------------
      - name: Deploy Backend & MySQL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # Aquí ocurre la magia del salto
          proxy_host: ${{ secrets.EC2_FRONTEND_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Bajar últimas imágenes de las APIs
            sudo docker pull rexdeadx/innovatech-ventas:latest
            sudo docker pull rexdeadx/innovatech-despachos:latest

            # 2.1 Levantar Base de Datos (MySQL)
            sudo docker stop mysql-db || true
            sudo docker rm mysql-db || true
            # Nota: Ajusta MYSQL_ROOT_PASSWORD según lo que use tu código Java
            sudo docker run -d -p 3306:3306 --name mysql-db \
              -e MYSQL_ROOT_PASSWORD=root \
              -e MYSQL_DATABASE=innovatech mysql:8.0

            # 2.2 Levantar API de Ventas (Puerto 8080)
            sudo docker stop api-ventas || true
            sudo docker rm api-ventas || true
            sudo docker run -d -p 8080:8080 --name api-ventas \
              --link mysql-db:mysql \
              rexdeadx/innovatech-ventas:latest

            # 2.3 Levantar API de Despachos (Puerto 8081)
            sudo docker stop api-despachos || true
            sudo docker rm api-despachos || true
            sudo docker run -d -p 8081:8081 --name api-despachos \
              --link mysql-db:mysql \
              rexdeadx/innovatech-despachos:latest