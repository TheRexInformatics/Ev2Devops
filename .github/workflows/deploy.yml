name: CI/CD Pipeline Innovatech

on:
  push:
    branches: [ "deploy" ] # Se activa solo al hacer push a la rama deploy (Requisito pauta)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 1. Construcción y Publicación del FRONTEND
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-front:latest

      # 2. Construcción y Publicación de BACKEND VENTAS
      - name: Build and Push Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-ventas:latest

      # 3. Construcción y Publicación de BACKEND DESPACHOS
      - name: Build and Push Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-despachos:latest

  deploy:
    needs: build-and-push # Espera a que las imágenes se suban a Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/app
            cd /home/${{ secrets.EC2_USER }}/app
          
            docker-compose pull
            
            docker-compose up -d --remove-orphans