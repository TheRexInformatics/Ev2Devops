name: Deploy InnovaTech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Images
        run: |
          # 1. Construir las imágenes con el tag que espera tu Docker Hub
          docker build -t rexdeadx/innovatech-front:latest ./frontend
          docker build -t rexdeadx/innovatech-ventas:latest ./back-ventas
          docker build -t rexdeadx/innovatech-despachos:latest ./back-despachos

          # 2. Subirlas (Aquí es donde fallaba antes porque el nombre no coincidía)
          docker push rexdeadx/innovatech-front:latest
          docker push rexdeadx/innovatech-ventas:latest
          docker push rexdeadx/innovatech-despachos:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin deploy
            # Limpieza de volúmenes para el cambio de Postgres a MySQL
            sg docker -c "docker-compose down -v"
            sg docker -c "docker-compose pull"
            sg docker -c "docker-compose up -d"