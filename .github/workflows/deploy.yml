name: CI/CD Pipeline Innovatech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Images
        run: |
          docker compose build
          docker tag innovatech-frontend ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-front:latest
          docker tag innovatech-back-ventas ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-ventas:latest
          docker tag innovatech-back-despachos ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-despachos:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-front:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-ventas:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-despachos:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/app
            cd /home/${{ secrets.EC2_USER }}/app
            # Eliminar archivos viejos y crear el nuevo docker-compose.yml en el servidor
            cat <<EOF > docker-compose.yml
            $(cat docker-compose.yml)
            EOF
            # Actualizar imágenes y levantar
            docker compose pull
            docker compose up -d --remove-orphansgit add .